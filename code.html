<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#075c2e">
  <title>北理珠通行码</title>
  <style>
    :root {
      --green: #075c2e;
      --qr-green: #13871b;
      --red: #ff1111;
      --ink: #304357;
      --header-h: clamp(104px, 26.43vw, 156px);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      background: #064c28;
      color: var(--green);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input, select { font: inherit; }

    .app {
      position: relative;
      isolation: isolate;
      width: min(100%, 592px);
      min-height: 100svh;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 52% 42%, rgba(12, 109, 55, .45), transparent 52%),
        linear-gradient(135deg, #075c2e 0%, #07582c 55%, #064925 100%);
    }

    .network {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      opacity: .72;
      pointer-events: none;
    }

    .brand-header {
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 clamp(18px, 7vw, 46px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2.2vw, 13px);
      width: 100%;
      transform: translate(13px, -11px);
    }

    .seal {
      width: clamp(50px, 12.9vw, 76px);
      height: clamp(50px, 12.9vw, 76px);
      flex: 0 0 auto;
      object-fit: contain;
      border-radius: 50%;
    }

    .brand-copy {
      min-width: 0;
      color: #fff;
    }

    .brand-name {
      display: flex;
      align-items: flex-end;
      white-space: nowrap;
      line-height: 1;
    }

    .bit-wordmark {
      width: clamp(153px, 41.4vw, 245px);
      height: clamp(31px, 6.9vw, 41px);
      flex: 0 0 auto;
      overflow: hidden;
    }

    .bit-wordmark img {
      display: block;
      width: 100%;
      height: auto;
      transform: translateY(0);
    }

    .zhuhai-cn {
      margin: 0 0 1px -10px;
      font: 600 clamp(18px, 6vw, 32px)/1 "STKaiti", "KaiTi", "FZKai-Z03S", serif;
      letter-spacing: -1.5px;
      text-shadow: 0 0 .35px currentColor;
      transform: translateX(-9px);
    }

    .brand-en {
      margin-top: clamp(3px, .95vw, 5px);
      font: 700 clamp(9px, 2.3vw, 13.6px)/1 "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
      letter-spacing: clamp(.2px, .09vw, .55px);
      white-space: nowrap;
      transform: scaleX(.955);
      transform-origin: left center;
    }

    .pass-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: calc(100svh - var(--header-h) - clamp(18px, 4.1vw, 24px));
      margin: 0 clamp(14px, 4.97vw, 29px) clamp(18px, 4.1vw, 24px);
      padding: clamp(29px, 7.6vw, 45px) clamp(15px, 2.55vw, 15px) clamp(35px, 9.25vw, 55px);
      overflow: hidden;
      background: #fff;
      border: 1px solid #d8d8d8;
      border-radius: 9px;
      box-shadow: 0 0 10px rgba(255,255,255,.42), 0 3px 14px rgba(0,0,0,.22);
    }

    .time-box {
      align-self: center;
      width: calc(100% - clamp(28px, 7.2vw, 43px));
      min-height: clamp(44px, 11.1vw, 66px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(5px, 1.2vw, 8px) 8px;
      overflow: hidden;
      border-radius: 7px;
      background: var(--ink);
      color: #fff;
      font: 400 clamp(20px, 6.95vw, 41px)/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      letter-spacing: clamp(-1px, -.06vw, 0px);
      white-space: nowrap;
    }

    .qr-wrap {
      display: flex;
      justify-content: center;
      margin-top: clamp(23px, 5.1vw, 30px);
    }

    .qr-grid {
      width: clamp(178px, 38.6vw, 228px);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(53, 1fr);
      grid-template-rows: repeat(53, 1fr);
      overflow: hidden;
      background: #fff;
    }

    .qr-grid i { display: block; background: transparent; }
    .qr-grid i.on { background: var(--qr-green); }

    .summary {
      margin: clamp(18px, 5vw, 26px) auto 0;
      color: var(--red);
      font-size: clamp(16px, 3.9vw, 23px);
      font-weight: 800;
      line-height: 1.35;
      text-align: center;
      white-space: nowrap;
    }

    .divider {
      margin: clamp(10px, 2.3vw, 14px) -3px 0;
      border: 0;
      border-top: 1px dotted #9d9d9d;
    }

    .role-title {
      display: grid;
      grid-template-columns: minmax(70px, 108px) auto minmax(70px, 108px);
      justify-content: center;
      align-items: center;
      gap: clamp(26px, 11vw, 52px);
      margin: clamp(17px, 4vw, 22px) 0 0;
      color: var(--green);
      font-size: clamp(25px, 6.7vw, 35px);
      font-weight: 800;
      line-height: 1;
    }

    .role-title::before, .role-title::after {
      content: "";
      height: 2px;
      background: var(--green);
    }

    .details {
      margin: clamp(39px, 10.4vw, 61px) clamp(8px, 2.1vw, 12px) 0;
      font-size: clamp(16px, 3.7vw, 22px);
      line-height: 1.78;
    }

    .detail-row {
      display: grid;
      grid-template-columns: clamp(73px, 13.4vw, 79px) 1fr;
      white-space: nowrap;
    }

    #detailIdentity { min-width: 0; white-space: normal; overflow-wrap: anywhere; }

    .notice {
      margin-top: clamp(20px, 4.4vw, 27px);
      color: var(--red);
      text-align: center;
      font-size: clamp(16px, 3.5vw, 21px);
      line-height: 1.5;
    }

    .notice strong { font-weight: 800; }

    .footer-warning {
      margin: auto 0 0;
      padding-top: clamp(36px, 7.5vw, 44px);
      color: var(--red);
      text-align: center;
      font-size: clamp(14px, 3.5vw, 21px);
      line-height: 1.45;
      white-space: nowrap;
    }

    .edit-hint {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      max-width: calc(100vw - 32px);
      padding: 9px 15px;
      border-radius: 999px;
      background: rgba(18, 34, 29, .88);
      color: #fff;
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .24s ease, transform .24s ease;
    }

    .edit-hint.show { opacity: 1; transform: translate(-50%, 0); }

    .editor {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: end center;
      padding: 18px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: rgba(0,0,0,.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s ease, visibility .2s ease;
    }

    .editor.open { opacity: 1; visibility: visible; }

    .editor-panel {
      width: min(100%, 460px);
      padding: 24px 20px calc(20px + env(safe-area-inset-bottom));
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
      transform: translateY(18px);
      transition: transform .2s ease;
    }

    .editor.open .editor-panel { transform: translateY(0); }

    .editor-title {
      margin: 0 0 18px;
      color: #173f2a;
      font-size: 22px;
      text-align: center;
    }

    .field { display: block; margin-top: 14px; }
    .field span { display: block; margin-bottom: 7px; color: #345143; font-size: 14px; }

    .field input, .field select {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #c8d1cc;
      border-radius: 8px;
      outline: none;
      background: #fff;
      color: #173f2a;
      font-size: 17px;
    }

    .field input:focus, .field select:focus {
      border-color: #08703a;
      box-shadow: 0 0 0 3px rgba(8,112,58,.12);
    }

    .form-actions { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; margin-top: 22px; }

    .form-actions button {
      height: 46px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .cancel-btn { background: #e9eeeb; color: #365044; }
    .generate-btn { background: #08703a; color: #fff; }

    @media (max-width: 410px) {
      .brand-header { padding-inline: 15px; }
      .brand { gap: 8px; }
      .bit-wordmark { width: clamp(153px, 41.4vw, 170px); height: clamp(26px, 6.9vw, 29px); }
      .zhuhai-cn { font-size: clamp(15px, 4.6vw, 18px); }
      .brand-en { font-size: clamp(8px, 2.4vw, 9px); letter-spacing: .1px; }
      .summary { font-size: clamp(12px, 3.55vw, 14px); letter-spacing: -.35px; }
      .role-title { gap: 25px; margin-inline: 0; }
      .details { line-height: 1.7; }
    }

    @media (max-width: 340px) {
      .seal { width: 45px; height: 45px; }
      .bit-wordmark { width: 140px; height: 25px; }
      .zhuhai-cn { font-size: 14px; }
      .brand-en { font-size: 7.4px; }
      .time-box { font-size: 20.5px; letter-spacing: -.4px; }
      .summary { font-size: 11.5px; }
      .role-title { grid-template-columns: 1fr auto 1fr; gap: 14px; font-size: 22px; }
      .details { font-size: 14px; }
      #detailIdentity { font-size: 13px; }
      .footer-warning { font-size: 10.5px; }
    }

    @media (min-width: 680px) {
      body { padding-block: 22px; }
      .app { min-height: calc(100svh - 44px); border-radius: 12px; box-shadow: 0 12px 45px rgba(0,0,0,.28); }
      .pass-card { min-height: calc(100svh - 44px - var(--header-h) - 63px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }

    @media print {
      body { background: #fff; padding: 0; }
      .app { width: 100%; box-shadow: none; }
      .editor, .edit-hint { display: none !important; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <svg class="network" viewBox="0 0 473 914" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke="#008f84" stroke-width="1">
        <path d="M84 8 L195 0 L338 16 L195 67 L84 8 L128 77 L33 123 L84 8"/>
        <path d="M195 0 L195 67 L207 126 M128 77 L195 67 L207 126 M84 8 L207 126" opacity=".78"/>
        <path d="M338 16 L195 67 L128 77 L33 123" opacity=".58"/>
        <path d="M0 655 L44 628 L0 564 M44 628 L98 702" opacity=".8"/>
        <path d="M473 613 L431 644 L473 686 M431 644 L473 720" opacity=".74"/>
        <path d="M0 742 L47 716 L0 678 M473 802 L427 770 L473 744" opacity=".52"/>
      </g>
      <g fill="#00aeb9">
        <circle cx="84" cy="8" r="4.2"/><circle cx="195" cy="0" r="3.8"/>
        <circle cx="338" cy="16" r="2.6"/><circle cx="195" cy="67" r="4.1"/>
        <circle cx="128" cy="77" r="3.2"/><circle cx="33" cy="123" r="2.7"/>
        <circle cx="0" cy="655" r="2.6"/><circle cx="473" cy="613" r="2.7"/>
        <circle cx="0" cy="742" r="2.4"/><circle cx="473" cy="802" r="2.5"/>
      </g>
    </svg>

    <header class="brand-header">
      <div class="brand" aria-label="北京理工大学（珠海）">
        <img class="seal" src="https://www.bit.edu.cn/images/gb20190805/logo_01.png" alt="北京理工大学校徽">
        <div class="brand-copy">
          <div class="brand-name">
            <div class="bit-wordmark">
              <img src="https://www.bit.edu.cn/images/gb20190805/logo_02.png" alt="北京理工大学">
            </div>
            <span class="zhuhai-cn">（珠海）</span>
          </div>
          <div class="brand-en">BEIJING INSTITUTE OF TECHNOLOGY, ZHUHAI</div>
        </div>
      </div>
    </header>

    <section class="pass-card" id="passCard" aria-label="校友通行码">
      <time class="time-box" id="timeDisplay">2026-07-27 16:07:51</time>

      <div class="qr-wrap" aria-label="动态通行二维码">
        <div class="qr-grid" id="qrcode" role="img" aria-label="绿色动态通行二维码"></div>
      </div>

      <div class="summary">
        申请人： <span id="summaryName">吴科儒</span>（校友）；车牌： <span id="summaryPlate">粤CDN6616</span>
      </div>

      <hr class="divider">

      <div class="role-title"><span>校友</span></div>

      <div class="details">
        <div class="detail-row"><span>姓名：</span><span id="detailName">吴科儒</span></div>
        <div class="detail-row"><span>性别：</span><span id="detailGender">女</span></div>
        <div class="detail-row"><span>身份证：</span><span id="detailIdentity">440882*********327</span></div>
      </div>

      <div class="notice">
        <div>进校时</div>
        <strong>请出示 证件 及 本通行码</strong>
        <div>以便门卫核对身份</div>
      </div>

      <div class="footer-warning">**通行码仅限本人使用， 转借将取消入校资格！</div>
    </section>
  </main>

  <div class="edit-hint" id="editHint" role="status">长按页面可修改通行信息</div>

  <div class="editor" id="editor" aria-hidden="true">
    <form class="editor-panel" id="editorForm">
      <h2 class="editor-title">修改通行信息</h2>

      <label class="field">
        <span>申请人</span>
        <input id="nameInput" name="name" type="text" maxlength="12" autocomplete="name" required>
      </label>

      <label class="field">
        <span>性别</span>
        <select id="genderInput" name="gender" required>
          <option value="女">女</option>
          <option value="男">男</option>
        </select>
      </label>

      <label class="field">
        <span>车牌</span>
        <input id="plateInput" name="plate" type="text" maxlength="12" inputmode="text" autocapitalize="characters" required>
      </label>

      <label class="field">
        <span>身份证</span>
        <input id="identityInput" name="identity" type="text" maxlength="24" inputmode="text" autocomplete="off" placeholder="支持完整号码或脱敏格式" required>
      </label>

      <div class="form-actions">
        <button class="cancel-btn" id="cancelEdit" type="button">取消</button>
        <button class="generate-btn" type="submit">生成通行码</button>
      </div>
    </form>
  </div>

  <script>
    (() => {
      "use strict";

      const defaults = { name: "吴科儒", gender: "女", plate: "粤CDN6616", identity: "440882*********327" };
      const storageKey = "bit-zhuhai-pass-profile-v2";
      const $ = (id) => document.getElementById(id);

      const editor = $("editor");
      const form = $("editorForm");
      const nameInput = $("nameInput");
      const genderInput = $("genderInput");
      const plateInput = $("plateInput");
      const identityInput = $("identityInput");
      const hint = $("editHint");
      const app = $("app");

      function requestWechatToolbarHide() {
        try {
          const bridge = window.WeixinJSBridge;
          if (bridge && typeof bridge.call === "function") bridge.call("hideToolbar");
        } catch (_) {}
      }

      if (window.WeixinJSBridge) {
        requestWechatToolbarHide();
      } else {
        document.addEventListener("WeixinJSBridgeReady", requestWechatToolbarHide, { once: true });
      }
      window.addEventListener("pageshow", requestWechatToolbarHide);

      function loadProfile() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey));
          return saved && saved.name && saved.gender && saved.plate
            ? { ...saved, identity: saved.identity || defaults.identity }
            : defaults;
        } catch (_) {
          return defaults;
        }
      }

      let profile = loadProfile();
      let hintTimer;

      function showHint(message, duration = 2600) {
        clearTimeout(hintTimer);
        hint.textContent = message;
        hint.classList.add("show");
        hintTimer = setTimeout(() => hint.classList.remove("show"), duration);
      }

      function openEditor() {
        nameInput.value = profile.name;
        genderInput.value = profile.gender;
        plateInput.value = profile.plate;
        identityInput.value = profile.identity;
        editor.classList.add("open");
        editor.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        setTimeout(() => nameInput.focus(), 80);
      }

      function closeEditor() {
        editor.classList.remove("open");
        editor.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }

      function normalizePlate(value) {
        return value.trim().replace(/\s+/g, "").toUpperCase();
      }

      function renderProfile() {
        $("summaryName").textContent = profile.name;
        $("detailName").textContent = profile.name;
        $("detailGender").textContent = profile.gender;
        $("summaryPlate").textContent = profile.plate;
        $("detailIdentity").textContent = profile.identity;
        drawQR(profile.name + "|" + profile.gender + "|" + profile.plate + "|" + profile.identity);
      }

      function hashText(text) {
        let hash = 2166136261;
        for (let i = 0; i < text.length; i++) {
          hash ^= text.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function randomFrom(seed) {
        return () => {
          seed += 0x6D2B79F5;
          let t = seed;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function drawQR(seedText) {
        const size = 53;
        const qr = $("qrcode");
        const cells = new Uint8Array(size * size);
        const reserved = new Uint8Array(size * size);
        const rand = randomFrom(hashText(seedText));
        const at = (x, y) => y * size + x;

        const mark = (x, y, value, reserve = true) => {
          if (x < 0 || y < 0 || x >= size || y >= size) return;
          cells[at(x, y)] = value;
          if (reserve) reserved[at(x, y)] = 1;
        };

        const finder = (left, top) => {
          for (let y = -1; y <= 7; y++) {
            for (let x = -1; x <= 7; x++) {
              const border = x === 0 || x === 6 || y === 0 || y === 6;
              const center = x >= 2 && x <= 4 && y >= 2 && y <= 4;
              mark(left + x, top + y, border || center ? 1 : 0);
            }
          }
        };

        const alignment = (cx, cy) => {
          for (let y = -2; y <= 2; y++) {
            for (let x = -2; x <= 2; x++) {
              const ring = Math.abs(x) === 2 || Math.abs(y) === 2;
              mark(cx + x, cy + y, ring || (x === 0 && y === 0) ? 1 : 0);
            }
          }
        };

        finder(0, 0);
        finder(size - 7, 0);
        finder(0, size - 7);

        for (let i = 8; i < size - 8; i++) {
          mark(i, 6, i % 2 ? 0 : 1);
          mark(6, i, i % 2 ? 0 : 1);
        }

        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const index = at(x, y);
            if (!reserved[index]) cells[index] = rand() > .51 ? 1 : 0;
          }
        }

        alignment(18, 18);
        alignment(34, 18);
        alignment(18, 34);
        alignment(34, 34);
        alignment(45, 45);
        alignment(45, 27);

        const fragment = document.createDocumentFragment();
        for (let i = 0; i < cells.length; i++) {
          const cell = document.createElement("i");
          if (cells[i]) cell.className = "on";
          fragment.appendChild(cell);
        }
        qr.replaceChildren(fragment);
      }

      function updateTime() {
        const now = new Date();
        const two = (number) => String(number).padStart(2, "0");
        $("timeDisplay").textContent =
          `${now.getFullYear()}-${two(now.getMonth() + 1)}-${two(now.getDate())} ` +
          `${two(now.getHours())}:${two(now.getMinutes())}:${two(now.getSeconds())}`;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = nameInput.value.trim();
        const plate = normalizePlate(plateInput.value);
        const identity = identityInput.value.trim().replace(/\s+/g, "");
        if (!name || !plate || !identity) return;

        profile = { name, gender: genderInput.value, plate, identity };
        try { localStorage.setItem(storageKey, JSON.stringify(profile)); } catch (_) {}
        renderProfile();
        closeEditor();
        showHint("已生成新通行码，长按页面可继续修改", 2200);
      });

      $("cancelEdit").addEventListener("click", closeEditor);
      editor.addEventListener("click", (event) => {
        if (event.target === editor) closeEditor();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && editor.classList.contains("open")) closeEditor();
        if ((event.key === "e" || event.key === "E") && !editor.classList.contains("open")) openEditor();
      });

      app.addEventListener("dblclick", openEditor);

      let pressTimer;
      let startX = 0;
      let startY = 0;
      app.addEventListener("pointerdown", (event) => {
        startX = event.clientX;
        startY = event.clientY;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(openEditor, 650);
      });
      app.addEventListener("pointermove", (event) => {
        if (Math.hypot(event.clientX - startX, event.clientY - startY) > 10) clearTimeout(pressTimer);
      });
      ["pointerup", "pointercancel", "pointerleave"].forEach((name) => {
        app.addEventListener(name, () => clearTimeout(pressTimer));
      });

      renderProfile();
      updateTime();
      setInterval(updateTime, 1000);
      setTimeout(() => showHint("长按页面可修改姓名、性别、车牌和身份证", 3000), 700);
    })();
  </script>
</body>
</html>
